[project]
name = "niftypulse"
version = "0.1.0"
description = "Tick-level forecasting, regime detection and execution research on NSE, run as traceable distributed services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "msgspec>=0.18",
    "nats-py>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "prometheus-client>=0.21",
    "typer>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=2.1",
    "pyarrow>=18",
    "duckdb>=1.1",
    "httpx>=0.28",
    "websockets>=14",
    "tzdata>=2024.2",
    "sortedcontainers>=2.4",
    "truststore>=0.10",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
feed = [
    "upstox-python-sdk>=2.13",
]
ml = [
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "torch>=2.5",
    "hmmlearn>=0.3",
    "cvxpy>=1.6",
    "optuna>=4.1",
    "mlflow>=2.18",
    "onnx>=1.17",
    "onnxruntime>=1.20",
]

[project.scripts]
niftypulse = "niftypulse.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pandas-stubs>=3.0.5.260914",
    "ziglang>=0.13",
    "cmake>=3.30",
    "ninja>=1.11",
    "pybind11>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niftypulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["nats.*", "pyarrow.*", "duckdb.*", "upstox_client.*", "sortedcontainers.*", "asyncpg.*", "sklearn.*", "scipy.*", "lightgbm.*", "xgboost.*", "hmmlearn.*", "cvxpy.*", "onnxruntime.*", "optuna.*", "mlflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cvxpy", "cvxpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# PyTorch / scikit-learn / LightGBM return untyped values; keep strictness elsewhere.
module = ["niftypulse.models.*", "niftypulse.regime.*", "niftypulse.policy.*", "niftypulse.research.*"]
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
