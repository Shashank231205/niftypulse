# NATS server: JetStream enabled, one user per service, least-privilege subjects.
# Passwords come from the environment ($VAR), never from this file.
# Every consumer also needs the JetStream consumer API ($JS.API.CONSUMER.>), acks
# ($JS.ACK.>) and its reply inbox (_INBOX.>).

listen: $NATS_LISTEN
http: $NATS_HTTP_LISTEN
server_name: $NATS_SERVER_NAME

jetstream {
  store_dir: $NATS_STORE_DIR
  max_file_store: $NATS_MAX_FILE_STORE
}

authorization {
  users = [
    { user: admin, password: $NATS_ADMIN_PASSWORD }
    { user: recorder, password: $NATS_RECORDER_PASSWORD, permissions: {
        publish: ["md.>", "alert.>", "$JS.API.INFO", "$JS.API.STREAM.INFO.>"]
        subscribe: ["_INBOX.>"] } }
    { user: archiver, password: $NATS_ARCHIVER_PASSWORD, permissions: {
        publish: ["$JS.API.INFO", "$JS.API.STREAM.INFO.>", "$JS.API.CONSUMER.>", "$JS.ACK.>"]
        subscribe: ["md.>", "_INBOX.>"] } }
    { user: featurizer, password: $NATS_FEATURIZER_PASSWORD, permissions: {
        publish: ["feat.>", "dlq.>", "alert.>", "$JS.API.INFO", "$JS.API.STREAM.INFO.>", "$JS.API.CONSUMER.>", "$JS.ACK.>"]
        subscribe: ["md.>", "_INBOX.>"] } }
    { user: predictor, password: $NATS_PREDICTOR_PASSWORD, permissions: {
        publish: ["pred.>", "dlq.>", "alert.>", "$JS.API.INFO", "$JS.API.STREAM.INFO.>", "$JS.API.CONSUMER.>", "$JS.ACK.>"]
        subscribe: ["feat.>", "_INBOX.>"] } }
    { user: strategy, password: $NATS_STRATEGY_PASSWORD, permissions: {
        publish: ["decision.>", "dlq.>", "alert.>", "$JS.API.INFO", "$JS.API.STREAM.INFO.>", "$JS.API.CONSUMER.>", "$JS.ACK.>"]
        subscribe: ["pred.>", "md.>", "_INBOX.>"] } }
    { user: monitor, password: $NATS_MONITOR_PASSWORD, permissions: {
        publish: ["alert.>", "dlq.>", "$JS.API.INFO", "$JS.API.STREAM.INFO.>", "$JS.API.CONSUMER.>", "$JS.ACK.>"]
        subscribe: ["pred.>", "md.>", "decision.>", "_INBOX.>"] } }
    { user: gateway, password: $NATS_GATEWAY_PASSWORD, permissions: {
        publish: ["$JS.API.INFO", "$JS.API.STREAM.INFO.>", "$JS.API.CONSUMER.>", "$JS.ACK.>"]
        subscribe: ["pred.>", "decision.>", "alert.>", "_INBOX.>"] } }
  ]
}
