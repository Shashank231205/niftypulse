apiVersion: 1

# Grafana expands $VAR from its environment when it loads this file.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: $PROMETHEUS_URL
    isDefault: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: $JAEGER_QUERY_URL
